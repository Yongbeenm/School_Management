services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env.production
    restart: unless-stopped
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://localhost:4000/api/v1/health\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
